<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="popup.css">
    <title>ShrekDark</title>
    <meta charset='UTF-8' />
</head>

<body>
    <ul id="messageContainer"></ul>
    
    <nav class="scrolled">
        <img src="../img/icon100.png" alt="Extension icon">
        <div class="mainName">
            <span>Shrek</span><span>Dark</span>
        </div>
        <span>3.8</span>
    </nav>

    <main>
        <h2>⚙️ Settings</h2>
        <p>Click on any feature to configure it</p>
        
        <div id="features-grid" class="features-grid"></div>
    </main>

    <!-- Feature Dialog -->
    <div id="feature-dialog" class="feature-dialog">
        <div class="dialog-overlay"></div>
        <div class="dialog-container">
            <div class="dialog-header">
                <button id="close-dialog" class="dialog-close" title="Close (ESC)">✕</button>
                <h2 id="dialog-title"></h2>
            </div>
            
            <div class="dialog-body">
                <p id="dialog-description" class="dialog-description"></p>
                <div id="dialog-content" class="dialog-content"></div>
            </div>
            
            <div class="dialog-footer">
                <button id="prev-feature" class="nav-btn prev-btn" title="Previous feature">
                    <span>←</span>
                    <span class="btn-label">Previous</span>
                </button>
                <button id="next-feature" class="nav-btn next-btn" title="Next feature">
                    <span class="btn-label">Next</span>
                    <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <script src="options-new.js"></script>
</body>

</html>
